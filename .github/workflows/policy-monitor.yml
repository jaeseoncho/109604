name: Winner Aircon policy monitor

on:
  schedule:
    # 00:17 UTC = 09:17 KST. Scheduled jobs can start a few minutes late.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "policy_monitor.py"
      - "sources.json"
      - "sources_extra.json"
      - ".github/workflows/policy-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: winner-aircon-policy-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test comparison baseline persistence
        run: python -m unittest discover -s tests -v

      - name: Prepare runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("sources.json").read_text(encoding="utf-8"))
          extra = json.loads(Path("sources_extra.json").read_text(encoding="utf-8"))
          base.setdefault("sources", []).extend(extra.get("sources", []))
          Path("runtime_sources.json").write_text(
              json.dumps(base, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Bound slow official-site requests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep tracked source clean so saving the baseline can rebase safely.
          path = Path("runtime_policy_monitor.py")
          text = Path("policy_monitor.py").read_text(encoding="utf-8")
          replacements = {
              "def fetch_html(url: str, attempts: int = 3, timeout: int = 45)":
                  "def fetch_html(url: str, attempts: int = 2, timeout: int = 12)",
              "for raw_target in follow_links[:6]:":
                  "for raw_target in follow_links[:1]:",
              "fetch_html(target, attempts=2)":
                  "fetch_html(target, attempts=1, timeout=10)",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Check official policy sources
        id: monitor
        shell: bash
        run: |
          set -euo pipefail
          python runtime_policy_monitor.py --config runtime_sources.json
          python - <<'PY'
          import json
          import os

          with open("monitor_result.json", encoding="utf-8") as file:
              result = json.load(file)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"alert={'true' if result['alert'] else 'false'}\n")
              output.write("title<<POLICY_TITLE\n")
              output.write(result.get("title", "") + "\n")
              output.write("POLICY_TITLE\n")
              output.write(f"severity={result.get('severity', '')}\n")
              output.write(f"successful_sources={result.get('successful_sources', 0)}\n")
              output.write(f"total_sources={result.get('total_sources', 0)}\n")
              output.write(f"run_errors={result.get('run_errors', 0)}\n")
          PY

      - name: Open an assigned policy alert issue
        if: steps.monitor.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.monitor.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body-file policy_change_report.md \
            --assignee "${{ github.repository_owner }}"

      - name: Save comparison baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "winner-aircon-policy-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state/policy_state.json
          if git diff --cached --quiet; then
            echo "No state update to commit."
          else
            git commit -m "chore: update policy monitor state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Add run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 위너에어컨 정책 모니터"
            echo ""
            echo "- 결과: ${{ steps.monitor.outputs.severity || '실행 실패' }}"
            echo "- 확인 성공: ${{ steps.monitor.outputs.successful_sources || '0' }}/${{ steps.monitor.outputs.total_sources || '18' }}개 공식 출처"
            echo "- 이번 실행 오류: ${{ steps.monitor.outputs.run_errors || '확인 불가' }}개"
            echo "- 알림 이슈 생성: ${{ steps.monitor.outputs.alert || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
